plugins { id 'com.android.application' }
android {
  namespace 'in.zebjus.dronelab.companion'
  compileSdk 35
  defaultConfig {
    applicationId 'in.zebjus.dronelab.companion'
    minSdk 26
    targetSdk 35
    versionCode 1
    versionName '1.1.0-qr-beta.1'
  }
  buildTypes {
    debug {
      debuggable true
    }
    release {
      minifyEnabled false
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
