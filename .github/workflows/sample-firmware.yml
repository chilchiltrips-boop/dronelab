name: Build XIAO ESP32-C6 sample
on:
  workflow_dispatch:
  push:
    branches: [sample-build]
    paths:
      - firmware/xiao_c6_sample/**
      - tools/build_sample.py
      - .github/workflows/sample-firmware.yml
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.10 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile sample for Seeed XIAO ESP32-C6
        run: arduino-cli compile --fqbn esp32:esp32:XIAO_ESP32C6:CDCOnBoot=cdc --export-binaries --output-dir build firmware/xiao_c6_sample
      - name: Pack and validate flash images
        run: python3 tools/build_sample.py build
      - uses: actions/upload-artifact@v4
        with:
          name: xiao-c6-sample
          path: |
            firmware/XIAO_C6_SAMPLE_FACTORY.bin
            firmware/XIAO_C6_SAMPLE_APP.bin
            firmware/XIAO_C6_BOOTLOADER.bin
            firmware/XIAO_C6_PARTITIONS.bin
            firmware/sample.json
          retention-days: 7
      - name: Save verified binaries on build branch
        if: github.ref_name == 'sample-build'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/XIAO_C6_SAMPLE_FACTORY.bin firmware/XIAO_C6_SAMPLE_APP.bin firmware/XIAO_C6_BOOTLOADER.bin firmware/XIAO_C6_PARTITIONS.bin firmware/sample.json
          git commit -m 'Add compiled XIAO ESP32-C6 sample images'
          git push origin HEAD:sample-build
