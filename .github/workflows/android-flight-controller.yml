name: Android Landscape Flight WebRTC Tests
on:
  push:
    branches: [fix/kit-control-20261017, feature/android-adaptive-control-center-20261016, fix/android-178-acceptance-release-20261016, work/sta-ap-diagnostics-20261012, feature/android-landscape-flight-controller-v1.6.0, feature/unified-flight-training-v1.6.1, feature/android-reference-cockpit-v1.6.2, feature/unified-pid-settings-shell-v1.6.3, main, feature/pid-fullwidth-responsive-layout, feature/classroom-my-kits-webapp-v1-3-5]
    paths:
      - 'tools/android-direct-kit*'
      - 'vendor/peerjs*'
      - 'tools/android-menu-browser.mjs'
      - 'mobile-android/**'
      - 'pairing-code.js'
      - 'pairing-qr-ui.js'
      - 'vendor/qrgen.js'
      - 'vendor/jsqr.js'
      - 'tools/verify_signed_android_release.py'
      - '.github/workflows/build-qr-android.yml'
      - 'app-version.json'
      - 'docs/flight-training/**'
      - 'flight-input.js'
      - 'companion-flight.js'
      - 'companion.html'
      - 'companion.css'
      - 'companion.js'
      - 'pairing-core.js'
      - 'pairing-web.js'
      - 'js/tripod-page.js'
      - 'js/ui-controls.js'
      - 'tripod.html'
      - 'tools/flight-controller-browser.mjs'
      - 'tools/flight-preview-browser.mjs'
      - 'tools/flight-test-harness.mjs'
      - 'js/training-receiver.js'
      - 'tools/flight-input.test.mjs'
      - 'tools/apk-verifier.test.mjs'
      - 'tools/python-lab.test.mjs'
      - 'tools/android-camera-permission.test.mjs'
      - 'tools/release-signing.test.mjs'
      - '.github/workflows/android-flight-controller.yml'
      # Any source edit triggering the signed APK must trigger EVERY exact-SHA
      # publication gate. No check is skipped merely by a path filter.
      - 'tools/android-peerjs-menu-regression.test.mjs'
      - 'tools/flight-ack-priority.test.mjs'
      - 'tools/release-metadata.test.mjs'
      - 'tools/native-flight-acceptance.sh'
      - 'tools/configure-native-avd.py'
      - 'tools/network-transport.test.mjs'
      - 'tools/controls-browser.mjs'
      - 'tools/android-origin-wifi-nsd.test.mjs'
      - 'tools/android-grants-vault-ota.test.mjs'
      - 'tools/android-connection-reliability.test.mjs'
      - 'tools/android-simple-ap-connect.test.mjs'
      - 'tools/write_android_release_metadata.py'
      - 'tools/verify_android_assets.py'
      - 'tools/wait-release-checks.mjs'
      - 'companion-network.js'
      - 'android-native-bridge.js'
      - 'companion-menu.js'
      - 'remote-rtc.js'
      - 'remote-rtc-config.json'
      - 'js/kit-auth.js'
      - 'js/kit-network-policy.js'
      - 'js/kit-ack-diagnostics.js'
      - 'firmware-catalog.json'
      - 'vendor/crypto/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-rtc-joystick:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check simulator-only joystick and repository regressions
        run: |
          node --check companion-flight.js
          node --check flight-input.js
          node --check pairing-core.js
          node --check pairing-web.js
          node --check js/classroom-kits.js
          node --test tools/flight-input.test.mjs
          npm test
          npm run check
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real paired WebRTC and landscape cockpit smoke test
        run: |
          mkdir -p test-output
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/flight-http.log 2>&1 &
          sleep 3
          node tools/android-direct-kit-browser.mjs
          node tools/android-menu-browser.mjs
          node tools/flight-preview-browser.mjs
          node tools/flight-controller-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-flight-landscape-webrtc
          path: test-output/
          if-no-files-found: ignore
