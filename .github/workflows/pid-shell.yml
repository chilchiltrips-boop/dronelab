name: Unified PID Tuning Shell & Persistent WebRTC
on:
  push:
    branches: [fix/kit-control-20261017, fix/android-178-acceptance-release-20261016, work/sta-ap-diagnostics-20261012, feature/unified-pid-settings-shell-v1.6.3, feature/android-reference-cockpit-v1.6.2, main, feature/pid-fullwidth-responsive-layout, feature/authoritative-status-integration-20261021]
    paths:
      - 'vendor/peerjs*'
      - 'tools/android-menu-browser.mjs'
      - 'mobile-android/**'
      - 'docs/flight-training/**'
      - 'companion.html'
      - 'companion.css'
      - 'companion.js'
      - 'companion-flight.js'
      - 'flight-input.js'
      - 'tools/verify_signed_android_release.py'
      - 'tools/wait-release-checks.mjs'
      - '.github/workflows/build-qr-android.yml'
      - 'index.html'
      - 'tripod.html'
      - 'pairing-host-bridge.js'
      - 'pairing-web.js'
      - 'pairing.css'
      - 'tripod.css'
      - 'styles.css'
      - 'js/ui-controls.js'
      - 'sw.js'
      - 'tools/pid-shell-browser.mjs'
      - 'tools/python-lab.test.mjs'
      - 'tools/training-ui-contract.test.mjs'
      - '.github/workflows/pid-shell.yml'
      # Any source edit triggering the signed APK must trigger EVERY exact-SHA
      # publication gate. No check is skipped merely by a path filter.
      - 'tools/android-direct-kit*'
      - 'tools/flight-controller-browser.mjs'
      - 'tools/flight-preview-browser.mjs'
      - 'tools/android-peerjs-menu-regression.test.mjs'
      - 'tools/flight-ack-priority.test.mjs'
      - 'tools/apk-verifier.test.mjs'
      - 'tools/release-metadata.test.mjs'
      - 'tools/android-camera-permission.test.mjs'
      - 'tools/native-flight-acceptance.sh'
      - 'tools/configure-native-avd.py'
      - 'tools/release-signing.test.mjs'
      - 'tools/android_release_needed.py'
      - 'tools/android-release-needed.test.mjs'
      - 'tools/network-transport.test.mjs'
      - 'tools/controls-browser.mjs'
      - 'tools/android-origin-wifi-nsd.test.mjs'
      - 'tools/android-grants-vault-ota.test.mjs'
      - 'tools/android-connection-reliability.test.mjs'
      - 'tools/android-simple-ap-connect.test.mjs'
      - 'tools/write_android_release_metadata.py'
      - 'tools/verify_android_assets.py'
      - 'companion-network.js'
      - 'android-native-bridge.js'
      - 'companion-menu.js'
      - 'pairing-core.js'
      - 'pairing-code.js'
      - 'remote-rtc.js'
      - 'remote-rtc-config.json'
      - 'pairing-qr-ui.js'
      - 'vendor/qrgen.js'
      - 'vendor/jsqr.js'
      - 'js/kit-auth.js'
      - 'js/kit-network-policy.js'
      - 'js/kit-ack-diagnostics.js'
      - 'firmware-catalog.json'
      - 'vendor/crypto/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify code and repository tests
        run: |
          node --check pairing-host-bridge.js
          node --check pairing-web.js
          node --check js/ui-controls.js
          npm test
          npm run check
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test persistent real WebRTC and shared header
        run: |
          mkdir -p test-output
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pid-shell-http.log 2>&1 &
          sleep 3
          node tools/pid-shell-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pid-shell-visuals
          path: test-output/
          if-no-files-found: ignore
