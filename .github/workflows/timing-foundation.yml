name: Timing Foundation Regression
on:
  pull_request:
    paths:
      - 'FlightCore_Firmware/**'
      - 'js/kit-ack-diagnostics.js'
      - 'js/inline-dialogs.js'
      - 'tools/**'
      - 'VERSION.txt'
      - '.github/workflows/timing-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/run-domain-tests.mjs firmware
      - run: npm run check
      - run: python3 tools/verify_release.py
      - run: npm run verify:acceptance
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Simulated Kit, IMU/timing, motor, input and simulator integration
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/timing-http.log 2>&1 &
          for attempt in $(seq 1 20); do curl --silent --fail http://127.0.0.1:8765/ > /dev/null && break; sleep 0.5; done
          node tools/imu-status-browser.mjs
          node tools/flight-trace-browser.mjs
          node tools/a2-motor-setup-browser.mjs
          node tools/inline-actions-browser.mjs
          node tools/authoritative-status-browser.mjs
          node tools/simulator-startup-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing-simulation-evidence
          path: test-output/
          retention-days: 7
          if-no-files-found: ignore
