name: Vendor Python Lab Runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-python-lab.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vendor-python-lab
  cancel-in-progress: false
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy Pyodide and Monaco assets from pinned Aerion source
        env:
          SOURCE_COMMIT: e3573addbbdc74e444b2dbcc1e1663f1fe39e3e6
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/chilchiltrips-boop/zebjus-drone-simulator-lab/${SOURCE_COMMIT}"
          files=(
            vendor/pyodide/LICENSE
            vendor/pyodide/pyodide.js
            vendor/pyodide/pyodide.asm.js
            vendor/pyodide/pyodide.asm.wasm
            vendor/pyodide/pyodide-lock.json
            vendor/pyodide/python_stdlib.zip
            vendor/monaco/LICENSE
            vendor/monaco/ThirdPartyNotices.txt
            vendor/monaco/min/vs/loader.js
            vendor/monaco/min/vs/editor/editor.main.js
            vendor/monaco/min/vs/editor/editor.main.css
            vendor/monaco/min/vs/basic-languages/python/python.js
            vendor/monaco/min/vs/base/worker/workerMain.js
            vendor/monaco/min/vs/base/browser/ui/codicons/codicon/codicon.ttf
          )
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            curl --fail --location --silent --show-error --retry 4 --retry-delay 2 "$base/$path" --output "$path"
            test -s "$path"
            echo "$path $(wc -c < "$path") bytes"
          done
      - name: Verify source libraries
        run: |
          node --check vendor/pyodide/pyodide.js
          node --check vendor/monaco/min/vs/loader.js
          test "$(stat -c %s vendor/pyodide/pyodide.asm.wasm)" -gt 8000000
          test "$(stat -c %s vendor/monaco/min/vs/editor/editor.main.js)" -gt 3000000
      - name: Publish required Python Lab assets to DroneLab main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/pyodide vendor/monaco
          git diff --cached --quiet || git commit -m 'Vendor Pyodide Python 3 and Monaco Python IDE assets from Aerion'
          git pull --rebase origin main
          git push origin main
