name: Vendor Python Lab Runtime
on:
  push:
    branches: [main, feature/python-led-i2c-tripod-front-v1]
    paths:
      - '.github/workflows/vendor-python-lab.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vendor-python-lab
  cancel-in-progress: false
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy Pyodide and Monaco assets from pinned Aerion source
        env:
          SOURCE_COMMIT: e3573addbbdc74e444b2dbcc1e1663f1fe39e3e6
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/chilchiltrips-boop/zebjus-drone-simulator-lab/${SOURCE_COMMIT}"
          files=(
            vendor/pyodide/LICENSE
            vendor/pyodide/pyodide.js
            vendor/pyodide/pyodide.asm.js
            vendor/pyodide/pyodide.asm.wasm
            vendor/pyodide/pyodide-lock.json
            vendor/pyodide/python_stdlib.zip
            vendor/monaco/LICENSE
            vendor/monaco/ThirdPartyNotices.txt
            vendor/monaco/min/vs/loader.js
            vendor/monaco/min/vs/editor/editor.main.js
            vendor/monaco/min/vs/editor/editor.main.css
            vendor/monaco/min/vs/basic-languages/python/python.js
            vendor/monaco/min/vs/base/worker/workerMain.js
            vendor/monaco/min/vs/base/browser/ui/codicons/codicon/codicon.ttf
          )
          # Browser Matplotlib requires Pyodide wheels beyond the base runtime.
          # Copy exactly the transitive dependencies in the pinned lockfile.
          files+=(vendor/pyodide/contourpy-1.3.0-cp312-cp312-pyodide_2024_0_wasm32.whl)
          files+=(vendor/pyodide/cycler-0.12.1-py3-none-any.whl)
          files+=(vendor/pyodide/fonttools-4.51.0-py3-none-any.whl)
          files+=(vendor/pyodide/kiwisolver-1.4.5-cp312-cp312-pyodide_2024_0_wasm32.whl)
          files+=(vendor/pyodide/matplotlib-3.8.4-cp312-cp312-pyodide_2024_0_wasm32.whl)
          files+=(vendor/pyodide/matplotlib_pyodide-0.2.3-py3-none-any.whl)
          files+=(vendor/pyodide/numpy-2.0.2-cp312-cp312-pyodide_2024_0_wasm32.whl)
          files+=(vendor/pyodide/packaging-24.2-py3-none-any.whl)
          files+=(vendor/pyodide/pillow-10.2.0-cp312-cp312-pyodide_2024_0_wasm32.whl)
          files+=(vendor/pyodide/pyparsing-3.1.2-py3-none-any.whl)
          files+=(vendor/pyodide/python_dateutil-2.9.0.post0-py2.py3-none-any.whl)
          files+=(vendor/pyodide/pytz-2024.1-py2.py3-none-any.whl)
          files+=(vendor/pyodide/six-1.16.0-py2.py3-none-any.whl)
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            curl --fail --location --silent --show-error --retry 4 --retry-delay 2 "$base/$path" --output "$path"
            test -s "$path"
            echo "$path $(wc -c < "$path") bytes"
          done
      - name: Vendor pinned OpenCV Python WASM wheel
        run: |
          set -euo pipefail
          wheel="$(python3 - <<'PY'
          import json
          print(json.load(open('vendor/pyodide/pyodide-lock.json'))['packages']['opencv-python']['file_name'])
          PY
          )"
          curl --fail --location --silent --show-error --retry 4 "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/${wheel}" --output "vendor/pyodide/${wheel}"
          test -s "vendor/pyodide/${wheel}"
      - name: Verify Matplotlib and OpenCV Python wheels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          pkg=json.loads(Path('vendor/pyodide/pyodide-lock.json').read_text())['packages']
          for name in ["matplotlib","contourpy","numpy","cycler","six","fonttools","kiwisolver","packaging","pillow","pyparsing","python-dateutil","pytz","matplotlib-pyodide","opencv-python"]:
              d=pkg[name]; f=Path('vendor/pyodide')/d['file_name']
              assert f.is_file(),str(f)
              digest=hashlib.sha256(f.read_bytes()).hexdigest()
              assert digest==d['sha256'],f'{name} wheel SHA mismatch'
              print('VERIFIED',name,f.stat().st_size,'bytes')
          PY
      - name: Verify source libraries
        run: |
          node --check vendor/pyodide/pyodide.js
          node --check vendor/monaco/min/vs/loader.js
          test "$(stat -c %s vendor/pyodide/pyodide.asm.wasm)" -gt 8000000
          test "$(stat -c %s vendor/monaco/min/vs/editor/editor.main.js)" -gt 3000000
      - name: Publish checked Python runtime assets to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/pyodide vendor/monaco
          git diff --cached --quiet || git commit -m 'Vendor Pyodide Python 3 and Monaco Python IDE assets from Aerion'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
