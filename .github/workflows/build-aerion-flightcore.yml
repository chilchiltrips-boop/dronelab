name: Build Aerion I2C scanner A1 and A2
on:
  push:
    branches: [main]
    paths:
      - FlightCore_Firmware/AERION_I2C_SCANNER.ino
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: arduino/setup-arduino-cli@v2
      - name: Compile both board profiles with pinned Arduino ESP32 core
        run: python3 tools/build_firmware.py
      - name: Synchronize and verify release images
        run: |
          cp FlightCore_Firmware/catalog.json firmware-catalog.json
          python3 -c "import json; print(json.load(open('firmware-catalog.json'))['version'], file=open('VERSION.txt','w'))"
          python3 tools/verify_release.py
          npm test
      - name: Commit compiled images and matching metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add FlightCore_Firmware VERSION.txt firmware-catalog.json firmware-latest.json
          git diff --cached --quiet || git commit -m 'Release Aerion FC A1 and A2 I2C scanner 1.0.0'
          git push
