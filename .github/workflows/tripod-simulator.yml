name: Tripod PID Simulator Tests
on:
  push:
    branches: [fix/kit-control-20261017, fix/android-178-acceptance-release-20261016, work/sta-ap-diagnostics-20261012, feature/tripod-pid-simulator-v1.5.0, feature/tripod-realistic-pid-audio-v1.5.1, feature/tripod-v1.5.2-dynamics-assembly, feature/tripod-yaw-reverse-v1.5.3, feature/unified-flight-training-v1.6.1, feature/android-reference-cockpit-v1.6.2, feature/unified-pid-settings-shell-v1.6.3, main, feature/pid-fullwidth-responsive-layout]
    paths:
      - 'vendor/peerjs*'
      - 'tools/android-menu-browser.mjs'
      - 'mobile-android/**'
      - 'companion.html'
      - 'companion.css'
      - 'companion.js'
      - 'companion-flight.js'
      - 'flight-input.js'
      - 'pairing-core.js'
      - 'pairing-code.js'
      - 'pairing-qr-ui.js'
      - 'vendor/qrgen.js'
      - 'vendor/jsqr.js'
      - 'tools/verify_signed_android_release.py'
      - '.github/workflows/build-qr-android.yml'
      - 'app-version.json'
      - 'docs/flight-training/**'
      - 'tripod.html'
      - 'tripod.css'
      - 'js/tripod-physics.js'
      - 'js/tripod-page.js'
      - 'js/tripod-audio.js'
      - 'js/tripod-realism.js'
      - 'js/tripod-assembly-model.js'
      - 'js/tripod-experiments.js'
      - 'tools/tripod-physics.test.mjs'
      - 'tools/tripod-browser.mjs'
      - 'tools/tripod-quality-browser.mjs'
      - 'tools/export-flight-bench.mjs'
      - 'sw.js'
      - '.github/workflows/tripod-simulator.yml'
      # Any source edit triggering the signed APK must trigger EVERY exact-SHA
      # publication gate. No check is skipped merely by a path filter.
      - 'tools/android-direct-kit*'
      - 'tools/flight-controller-browser.mjs'
      - 'tools/flight-preview-browser.mjs'
      - 'tools/android-peerjs-menu-regression.test.mjs'
      - 'tools/flight-ack-priority.test.mjs'
      - 'tools/apk-verifier.test.mjs'
      - 'tools/release-metadata.test.mjs'
      - 'tools/android-camera-permission.test.mjs'
      - 'tools/native-flight-acceptance.sh'
      - 'tools/configure-native-avd.py'
      - 'tools/release-signing.test.mjs'
      - 'tools/network-transport.test.mjs'
      - 'tools/controls-browser.mjs'
      - 'tools/android-origin-wifi-nsd.test.mjs'
      - 'tools/android-grants-vault-ota.test.mjs'
      - 'tools/android-connection-reliability.test.mjs'
      - 'tools/android-simple-ap-connect.test.mjs'
      - 'tools/write_android_release_metadata.py'
      - 'tools/verify_android_assets.py'
      - 'tools/wait-release-checks.mjs'
      - 'companion-network.js'
      - 'android-native-bridge.js'
      - 'companion-menu.js'
      - 'remote-rtc.js'
      - 'remote-rtc-config.json'
      - 'js/kit-auth.js'
      - 'js/kit-network-policy.js'
      - 'js/kit-ack-diagnostics.js'
      - 'firmware-catalog.json'
      - 'vendor/crypto/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tripod:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate code and pure physics
        run: |
          node --check js/tripod-physics.js
          node --check js/tripod-page.js
          node --check js/tripod-audio.js
          node --check js/tripod-realism.js
          node --check js/tripod-assembly-model.js
          node --check js/tripod-experiments.js
          node --test tools/tripod-physics.test.mjs
          npm run check
          npm test
      - name: Install isolated Chromium test environment
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate rendered Tripod page, joystick input and responsive UI
        run: |
          mkdir -p test-output
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/tripod-http.log 2>&1 &
          sleep 3
          node tools/tripod-browser.mjs
          node tools/tripod-quality-browser.mjs
          node tools/export-flight-bench.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tripod-simulator-desktop-mobile
          path: test-output/
          if-no-files-found: ignore
