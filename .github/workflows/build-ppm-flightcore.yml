name: Build A1/A2 PPM FlightCore Candidate (no publication)
on:
  # Automatic A1/A2 (including PPM) releases are owned by build-i2c-scanner.yml.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flightcore-ppm-release-main
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify bench-only source lockout
        run: python3 tools/bench_release_gate.py --source
      - uses: arduino/setup-arduino-cli@v2
      - name: Compile verified A1 and A2 APP/FACTORY images
        run: python3 tools/build_scanner.py
      - name: Verify per-board image, partition, source hash, catalog, SHA256
        run: |
          python3 tools/verify_release.py
          python3 tools/bench_release_gate.py --compiled
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flightcore-ppm-a1-a2-build
          path: |
            FlightCore_Firmware/*_APP.bin
            FlightCore_Firmware/*_FACTORY.bin
            FlightCore_Firmware/build-report.json
            FlightCore_Firmware/catalog.json
          if-no-files-found: error
