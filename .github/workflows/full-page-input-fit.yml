name: Full DroneLab Form and Input Fit Audit
on:
  push:
    branches: [fix/complete-webapp-input-fit-audit]
    paths:
      - 'pairing.css'
      - 'index.html'
      - 'tripod.html'
      - 'styles.css'
      - 'companion.html'
      - 'firmware.css'
      - 'python-lab.css'
      - 'tools/full-page-input-fit-browser.mjs'
      - '.github/workflows/full-page-input-fit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  form-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run project validation and unit tests
        run: |
          node --check tools/full-page-input-fit-browser.mjs
          npm test
          npm run check
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Audit all page inputs at 360-1600px
        run: |
          mkdir -p test-output/form-fit
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/form-fit-http.log 2>&1 &
          sleep 3
          node tools/full-page-input-fit-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-form-fit-audit-screenshots
          path: test-output/form-fit
          if-no-files-found: warn
