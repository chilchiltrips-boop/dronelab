name: DroneLab V2 Safe Fixes — Nonhardware Regression

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'app-version.json', 'mobile-apk/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'app-version.json', 'mobile-apk/**']
  workflow_dispatch:

concurrency:
  group: v2-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-and-regression:
    name: Nonhardware source and regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check changed source syntax
        run: |
          node --check js/network-lab.js
          node --check js/classroom-kits.js
          node --check tools/network-transport.test.mjs
      - name: Run Node regressions
        run: npm test
      - name: Validate offline bundle and project
        run: npm run check
      # Pull requests may edit firmware source without publishing new binaries.
      # Firmware build job below recompiles A2 and verifies its artifacts.
      # Never compare unreleased PR source against the committed stable binary hashes.
      - name: Verify existing firmware catalog and binary release
        if: github.event_name != 'pull_request'
        run: npm run verify:firmware

  browser-v2:
    name: V2 layout and authenticated network integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Browser, Python and offline regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/v2-http.log 2>&1 &
          node tools/v2-layout-browser.mjs
          node tools/grant-toggle-layout-browser.mjs
          node tools/full-page-input-fit-browser.mjs
          node tools/pid-shell-browser.mjs
          node tools/network-browser.mjs
          node tools/android-menu-browser.mjs
          node tools/legacy-connectivity-browser.mjs
          node tools/exclusive-connectivity-browser.mjs
          node tools/offline-browser.mjs
          node tools/experimental-rate-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-browser-evidence
          path: test-output/
          retention-days: 7

  firmware-build:
    name: Compile A2 review firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # This workflow runs on every PR, but a UI-only change does not change
      # compiled FlightCore bytes. Keep this required job present while
      # skipping expensive Arduino installs and duplicate firmware builds.
      - name: Detect compiled firmware inputs changed
        id: firmware_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = push ]; then
            echo 'compile=false' >> "$GITHUB_OUTPUT"
            echo 'Main firmware publication workflow owns exact-source production build'
          elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "compile=true" >> "$GITHUB_OUTPUT"
            echo "Base SHA unavailable; conservatively compile A2"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            'FlightCore_Firmware/I2C_ADDRESS_SCANNER.ino' \
            'FlightCore_Firmware/*.h' \
            'FlightCore_Firmware/partitions.csv' \
            'FlightCore_Firmware/bench-release-policy.json' \
            'FlightCore_Firmware/publication-hold.json' \
            'VERSION.txt' \
            'js/pid-profiles.js' 'tools/sync-pid-profiles.mjs' \
            'tools/build_scanner.py' 'tools/embed_setup_portal.py' \
            'tools/setup-portal.html' 'tools/bench_release_gate.py' \
            'tools/verify_release.py' 'tools/firmware_compile_time.py' \
            'tools/verify_experimental_rate.py' '.github/actions/setup-flightcore/**' \
            '.github/workflows/v2-safe-fixes.yml' '.github/workflows/build-i2c-scanner.yml'; then
            echo "compile=false" >> "$GITHUB_OUTPUT"
            echo "No compiled firmware input changed; use existing verified package"
          else
            echo "compile=true" >> "$GITHUB_OUTPUT"
            echo "Compiled firmware input changed; run A2 review build"
          fi
      - uses: ./.github/actions/setup-flightcore
        if: steps.firmware_changes.outputs.compile == 'true'
      - run: python3 tools/embed_setup_portal.py
        if: steps.firmware_changes.outputs.compile == 'true'
      - run: python3 tools/build_scanner.py --skip-core-install
        if: steps.firmware_changes.outputs.compile == 'true'
      - run: python3 tools/bench_release_gate.py --compiled
        if: steps.firmware_changes.outputs.compile == 'true'
      - run: python3 tools/verify_release.py
        if: steps.firmware_changes.outputs.compile == 'true'
      - uses: actions/upload-artifact@v4
        if: steps.firmware_changes.outputs.compile == 'true'
        with:
          name: v2-review-a2-firmware
          path: |
            FlightCore_Firmware/ZEBJUS_FLIGHTCORE_A2_APP.bin
            FlightCore_Firmware/ZEBJUS_FLIGHTCORE_A2_FACTORY.bin
            FlightCore_Firmware/build-report.json
            FlightCore_Firmware/catalog.json
          if-no-files-found: error
      - name: Compile and verify separate experimental PPM Rate candidate
        if: steps.firmware_changes.outputs.compile == 'true'
        run: |
          python3 tools/build_scanner.py --skip-core-install --board ZFC-A2 --experimental-rate-flight --output-dir "$RUNNER_TEMP/a2-rate-experimental"
          python3 tools/verify_experimental_rate.py "$RUNNER_TEMP/a2-rate-experimental"
      - name: Verify candidate import without physical flashing
        if: steps.firmware_changes.outputs.compile == 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/rate-http.log 2>&1 &
          for attempt in $(seq 1 20); do curl --silent --fail http://127.0.0.1:8765/ > /dev/null && break; sleep 0.5; done
          A2_RATE_ARTIFACT_DIR="$RUNNER_TEMP/a2-rate-experimental" node tools/experimental-rate-browser.mjs
      - uses: actions/upload-artifact@v4
        if: steps.firmware_changes.outputs.compile == 'true'
        with:
          name: a2-PPM-RATE-EXPERIMENTAL-${{ github.sha }}
          path: ${{ runner.temp }}/a2-rate-experimental/
          if-no-files-found: error
