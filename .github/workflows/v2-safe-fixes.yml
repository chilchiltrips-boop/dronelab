name: DroneLab V2 Safe Fixes — Nonhardware Regression

on:
  push:
    branches:
      - feature/unified-connection-admin-v2
      - feature/simple-kit-connection-v1-4-1
      - feature/unified-connection-admin-v2-safe-fixes-20261013
  pull_request:
    branches:
      - main

concurrency:
  group: v2-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-and-regression:
    name: Nonhardware source and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check changed source syntax
        run: |
          node --check js/network-lab.js
          node --check js/classroom-kits.js
          node --check tools/network-transport.test.mjs
      - name: Run Node regressions
        run: npm test
      - name: Validate offline bundle and project
        run: npm run check
      - name: Verify existing firmware catalog and binary release
        run: npm run verify:firmware

  browser-v2:
    name: V2 layout and authenticated network integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Browser, Python and offline regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/v2-http.log 2>&1 &
          node tools/v2-layout-browser.mjs
          node tools/grant-toggle-layout-browser.mjs
          node tools/full-page-input-fit-browser.mjs
          node tools/pid-shell-browser.mjs
          node tools/network-browser.mjs
          node tools/android-menu-browser.mjs
          node tools/legacy-connectivity-browser.mjs
          node tools/exclusive-connectivity-browser.mjs
          node tools/offline-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-browser-evidence
          path: test-output/

  firmware-build:
    name: Compile A1 and A2 review firmware
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: python3 tools/embed_setup_portal.py
      - run: python3 tools/build_scanner.py
      - run: python3 tools/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: v2-review-a1-a2-firmware
          path: |
            FlightCore_Firmware/*_APP.bin
            FlightCore_Firmware/*_FACTORY.bin
            FlightCore_Firmware/build-report.json
            FlightCore_Firmware/catalog.json
          if-no-files-found: error

  # Bring compiled A1/A2 APP+FACTORY binaries and source hashes back to this
  # review branch exactly once. Production merge remains a separate gate.
  sync-review-firmware:
    name: Sync verified A1/A2 firmware to PR branch
    needs: firmware-build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/android-full-height-menu-panel-20261016'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: v2-review-a1-a2-firmware
          path: FlightCore_Firmware/
      - name: Check whether matching binaries are already committed
        id: required
        run: |
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          report=Path('FlightCore_Firmware/build-report.json')
          fresh=json.loads(report.read_text())
          matching=True
          for name,digest in fresh['sourceSha256'].items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest()!=digest:
                  raise SystemExit('Different source revision than compiled firmware: '+name)
          current=Path('firmware-catalog.json')
          if current.exists():
              try:
                  old=json.loads(current.read_text())
                  matching=all(
                      old['boards'][i]['latest']['app']['sha256'] ==
                      json.loads(Path('FlightCore_Firmware/catalog.json').read_text())['boards'][i]['latest']['app']['sha256']
                      for i in (0,1)
                  )
              except (KeyError,ValueError,IndexError):matching=False
          else:matching=False
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('sync='+('false' if matching else 'true')+'\n')
          PY
      - name: Sync verified firmware catalog and immutable images
        if: steps.required.outputs.sync == 'true'
        run: |
          set -euo pipefail
          cp FlightCore_Firmware/catalog.json firmware-catalog.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('firmware-catalog.json').read_text())
          newest=c['builtAt']
          latest={'schema':2,'product':'ZEBJUS_I2C_SCANNER','version':c['version'],'builtAt':newest,'catalog':'firmware-catalog.json','note':'Board-aware firmware catalog. Build automation marks each verified package available after compilation.'}
          Path('firmware-latest.json').write_text(json.dumps(latest,indent=2)+'\n')
          latest['catalog']='catalog.json'
          Path('FlightCore_Firmware/latest.json').write_text(json.dumps(latest,indent=2)+'\n')
          PY
          python3 tools/verify_release.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware-catalog.json firmware-latest.json FlightCore_Firmware/catalog.json FlightCore_Firmware/latest.json FlightCore_Firmware/build-report.json
          git add FlightCore_Firmware/*_APP.bin FlightCore_Firmware/*_FACTORY.bin
          git diff --cached --quiet || (git commit -m 'Sync verified A1/A2 signed-source firmware binaries [skip ci]' && git push origin HEAD:${{ github.event.pull_request.head.ref }})
