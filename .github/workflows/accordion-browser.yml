name: Verify Accordion Initialization and Visibility

on:
  push:
    branches: [fix/android-178-acceptance-release-20261016, main]
    paths:
      - 'vendor/peerjs*'
      - 'tools/android-menu-browser.mjs'
      - 'js/devices-workspace.js'
      - 'js/cloud-admin.js'
      - 'tools/accordion-browser.mjs'
      - 'index.html'
      - 'lab.html'
      - '.github/workflows/accordion-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accordion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate application and test syntax
        run: |
          npm run check
          node --check tools/accordion-browser.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test desktop and mobile accordion visibility
        run: |
          mkdir -p test-output/accordion
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/accordion-http.log 2>&1 &
          sleep 2
          node tools/accordion-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accordion-browser-evidence
          path: test-output/accordion
          if-no-files-found: ignore
