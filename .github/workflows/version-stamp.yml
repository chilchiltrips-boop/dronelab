name: Stamp DroneLab WebApp Version
on:
  push:
    branches: [main]
    paths-ignore:
      - 'app-version.json'
      - 'mobile-apk/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qr-version-stamp
  cancel-in-progress: false
jobs:
  stamp:
    if: ${{ !contains(github.event.head_commit.message, '[version-stamp]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
          fetch-depth: 0
      - name: Advance WebApp releases 1.9, 1.10, 1.11 independently of build numbers
        env:
          SOURCE_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: python3 tools/stamp_webapp_version.py
      - name: Save WebApp production version on main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-version.json
          git diff --cached --quiet || git commit -m 'Stamp main WebApp version [version-stamp]'
          git pull --rebase origin main
          git push origin HEAD:main
