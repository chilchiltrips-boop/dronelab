name: Build ZEBJUS Stable-Signed Android APK
on:
  push:
    branches: [fix/kit-control-20261017, fix/android-full-height-menu-panel-20261016, feature/android-adaptive-control-center-20261016, fix/android-178-acceptance-release-20261016, feature/unified-connection-admin-v2, work/sta-ap-diagnostics-20261012, testing/audit-compact-pairing-v1.4.5, testing/stable-android-signing-v1.4.2, testing/fast-qr-step2-signed-v1.4.3, feature/android-landscape-flight-controller-v1.6.0, feature/unified-flight-training-v1.6.1, feature/android-reference-cockpit-v1.6.2, feature/ap-sta-transport-v1, main]
    paths:
      - 'tools/android-direct-kit*'
      - 'vendor/peerjs*'
      - 'tools/android-menu-browser.mjs'
      - 'tools/pid-shell-browser.mjs'
      - 'tools/flight-controller-browser.mjs'
      - 'tools/flight-preview-browser.mjs'
      - 'tools/android-peerjs-menu-regression.test.mjs'
      - 'tools/flight-ack-priority.test.mjs'
      - 'tools/apk-verifier.test.mjs'
      - 'tools/release-metadata.test.mjs'
      - 'mobile-android/**'
      - 'tools/android-camera-permission.test.mjs'
      - 'tools/native-flight-acceptance.sh'
      - 'tools/configure-native-avd.py'
      - 'tools/release-signing.test.mjs'
      - 'tools/android_release_needed.py'
      - 'tools/android-release-needed.test.mjs'
      - 'tools/network-transport.test.mjs'
      - 'tools/controls-browser.mjs'
      - 'tools/android-origin-wifi-nsd.test.mjs'
      - 'tools/android-grants-vault-ota.test.mjs'
      - 'tools/android-connection-reliability.test.mjs'
      - 'tools/android-simple-ap-connect.test.mjs'
      - 'tools/verify_signed_android_release.py'
      - 'tools/write_android_release_metadata.py'
      - 'tools/verify_android_assets.py'
      - 'tools/wait-release-checks.mjs'
      - '.github/workflows/build-qr-android.yml'
      - 'companion.html'
      - 'companion.css'
      - 'companion.js'
      - 'companion-network.js'
      - 'android-native-bridge.js'
      - 'companion-flight.js'
      - 'companion-menu.js'
      - 'flight-input.js'
      - 'pairing-core.js'
      - 'pairing-code.js'
      - 'remote-rtc.js'
      - 'remote-rtc-config.json'
      - 'pairing-qr-ui.js'
      - 'vendor/qrgen.js'
      - 'vendor/jsqr.js'
      - 'js/kit-auth.js'
      - 'js/kit-network-policy.js'
      - 'js/kit-ack-diagnostics.js'
      - 'firmware-catalog.json'
      - 'vendor/crypto/**'
  # This entire path set is mirrored in the six exact-SHA required workflows.
  # tools/android-release-gate-triggers.test.mjs guards against drift.
  # Web-only PID changes do not produce a duplicate signed APK. Existing APK
  # releases are immutable; Android UI/package changes require incrementing
  # versionCode and passing the exact-source signed native release gate.
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: zebjus-android-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release_candidate:
    name: Check whether Android package inputs changed
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.candidate.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain an identical published APK or require a newer upgrade
        id: candidate
        run: python3 tools/android_release_needed.py

  android:
    needs: release_candidate
    if: needs.release_candidate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Package Flight Training, WebRTC and camera assets
        run: |
          set -euo pipefail
          mkdir -p mobile-android/app/src/main/assets/vendor/crypto mobile-android/app/src/main/assets/js
          cp companion.html companion.css companion.js companion-network.js android-native-bridge.js companion-flight.js companion-menu.js flight-input.js pairing-core.js pairing-code.js pairing-qr-ui.js remote-rtc.js remote-rtc-config.json mobile-android/app/src/main/assets/
          cp js/kit-auth.js js/kit-network-policy.js js/kit-ack-diagnostics.js mobile-android/app/src/main/assets/js/
          cp firmware-catalog.json mobile-android/app/src/main/assets/
          cp vendor/crypto/zfc-crypto.js mobile-android/app/src/main/assets/vendor/crypto/
          cp vendor/qrgen.js vendor/jsqr.js vendor/peerjs.min.js vendor/peerjs.LICENSE mobile-android/app/src/main/assets/vendor/
          test -s mobile-android/app/src/main/assets/companion.html
          test -s mobile-android/app/src/main/assets/pairing-code.js
          test -s mobile-android/app/src/main/assets/remote-rtc.js
          test -s mobile-android/app/src/main/assets/companion-flight.js
          test -s mobile-android/app/src/main/assets/companion-menu.js
          test -s mobile-android/app/src/main/assets/js/kit-network-policy.js
          test -s mobile-android/app/src/main/assets/js/kit-ack-diagnostics.js
          test -s mobile-android/app/src/main/assets/android-native-bridge.js
          test -s mobile-android/app/src/main/assets/companion-network.js
          test -s mobile-android/app/src/main/assets/firmware-catalog.json
          test -s mobile-android/app/src/main/assets/flight-input.js
          test -s mobile-android/app/src/main/assets/vendor/jsqr.js
          test -s mobile-android/app/src/main/assets/vendor/peerjs.min.js
          test -s mobile-android/app/src/main/assets/vendor/peerjs.LICENSE

      - name: Check Android camera, code pairing and permanent release-signing rules
        run: |
          node --check tools/network-browser.mjs
          node --check pairing-code.js
          node --check companion-network.js
          node --check companion-flight.js
          node --check companion-menu.js
          node --test tools/udp-rc-contract.test.mjs tools/android-direct-kit-control.test.mjs tools/android-peerjs-menu-regression.test.mjs tools/android-camera-permission.test.mjs tools/code-pairing.test.mjs tools/release-signing.test.mjs tools/android-connection-reliability.test.mjs tools/network-transport.test.mjs tools/flight-ack-priority.test.mjs tools/apk-verifier.test.mjs tools/android-simple-ap-connect.test.mjs

      - name: Validate debug compilation (never publish a debug APK)
        run: gradle -p mobile-android :app:assembleDebug --no-daemon

      - name: Load PRIVATE signing key from encrypted GitHub secrets
        if: github.ref == 'refs/heads/fix/kit-control-20261017' || github.ref == 'refs/heads/fix/android-178-acceptance-release-20261016' || github.ref == 'refs/heads/fix/android-full-height-menu-panel-20261016' || github.ref == 'refs/heads/feature/android-adaptive-control-center-20261016' || github.ref == 'refs/heads/feature/unified-connection-admin-v2' || github.ref == 'refs/heads/work/sta-ap-diagnostics-20261012' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing/audit-compact-pairing-v1.4.5' || github.ref == 'refs/heads/feature/unified-flight-training-v1.6.1' || github.ref == 'refs/heads/feature/android-reference-cockpit-v1.6.2'
        env:
          ZEBJUS_ANDROID_KEYSTORE_B64: ${{ secrets.ZEBJUS_ANDROID_KEYSTORE_B64 }}
          ZEBJUS_ANDROID_SIGNING_PASSWORD: ${{ secrets.ZEBJUS_ANDROID_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ZEBJUS_ANDROID_KEYSTORE_B64}" || -z "${ZEBJUS_ANDROID_SIGNING_PASSWORD}" ]]; then
            echo "::error::Missing release signing secrets. Set ZEBJUS_ANDROID_KEYSTORE_B64 and ZEBJUS_ANDROID_SIGNING_PASSWORD in GitHub Settings > Secrets and variables > Actions. See ANDROID_SIGNING_SETUP.md."
            exit 1
          fi
          umask 077
          KEYFILE="$RUNNER_TEMP/zebjus-release.p12"
          printf '%s' "$ZEBJUS_ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYFILE"
          test -s "$KEYFILE"
          echo "ZEBJUS_ANDROID_RELEASE_KEYSTORE_FILE=$KEYFILE" >> "$GITHUB_ENV"

      - name: Assemble permanently signed non-debug release APK
        if: github.ref == 'refs/heads/fix/kit-control-20261017' || github.ref == 'refs/heads/fix/android-178-acceptance-release-20261016' || github.ref == 'refs/heads/fix/android-full-height-menu-panel-20261016' || github.ref == 'refs/heads/feature/android-adaptive-control-center-20261016' || github.ref == 'refs/heads/feature/unified-connection-admin-v2' || github.ref == 'refs/heads/work/sta-ap-diagnostics-20261012' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing/audit-compact-pairing-v1.4.5' || github.ref == 'refs/heads/feature/unified-flight-training-v1.6.1' || github.ref == 'refs/heads/feature/android-reference-cockpit-v1.6.2'
        env:
          ZEBJUS_ANDROID_SIGNING_PASSWORD: ${{ secrets.ZEBJUS_ANDROID_SIGNING_PASSWORD }}
        run: gradle -p mobile-android :app:assembleRelease --stacktrace --no-daemon

      - name: Refuse wrong APK certificate or app identity
        if: github.ref == 'refs/heads/fix/kit-control-20261017' || github.ref == 'refs/heads/fix/android-178-acceptance-release-20261016' || github.ref == 'refs/heads/fix/android-full-height-menu-panel-20261016' || github.ref == 'refs/heads/feature/android-adaptive-control-center-20261016' || github.ref == 'refs/heads/feature/unified-connection-admin-v2' || github.ref == 'refs/heads/work/sta-ap-diagnostics-20261012' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing/audit-compact-pairing-v1.4.5' || github.ref == 'refs/heads/feature/unified-flight-training-v1.6.1' || github.ref == 'refs/heads/feature/android-reference-cockpit-v1.6.2'
        run: |
          set -euo pipefail
          RELEASE_APK="mobile-android/app/build/outputs/apk/release/app-release.apk"
          test -s "$RELEASE_APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"
          python3 tools/verify_signed_android_release.py "$RELEASE_APK" "$BUILD_TOOLS/apksigner" "$BUILD_TOOLS/aapt" mobile-apk/ZEBJUS_DroneLab_ANDROID_RELEASE.apk
          python3 tools/verify_android_assets.py "$RELEASE_APK"
          unzip -l "$RELEASE_APK" | grep -E 'assets/(companion.html|pairing-core.js|pairing-code.js|vendor/jsqr.js)'
          unzip -t "$RELEASE_APK" >/dev/null
          echo "Verified release APK size: $(stat -c %s "$RELEASE_APK") bytes"

      - name: Package one stable Android APK update URL
        if: github.ref == 'refs/heads/fix/kit-control-20261017' || github.ref == 'refs/heads/fix/android-178-acceptance-release-20261016' || github.ref == 'refs/heads/fix/android-full-height-menu-panel-20261016' || github.ref == 'refs/heads/feature/android-adaptive-control-center-20261016' || github.ref == 'refs/heads/feature/unified-connection-admin-v2' || github.ref == 'refs/heads/work/sta-ap-diagnostics-20261012' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing/audit-compact-pairing-v1.4.5' || github.ref == 'refs/heads/feature/unified-flight-training-v1.6.1' || github.ref == 'refs/heads/feature/android-reference-cockpit-v1.6.2'
        run: |
          set -euo pipefail
          cp mobile-apk/ZEBJUS_DroneLab_ANDROID_RELEASE.apk "$RUNNER_TEMP/zebjus-previous.apk"
          mkdir -p mobile-apk
          cp mobile-android/app/build/outputs/apk/release/app-release.apk mobile-apk/ZEBJUS_DroneLab_ANDROID_RELEASE.apk
          sha256sum mobile-apk/ZEBJUS_DroneLab_ANDROID_RELEASE.apk | tee mobile-apk/SHA256SUMS.txt
          sha256sum -c mobile-apk/SHA256SUMS.txt
          # Produce readable metadata from the same checked Gradle identity.
          python3 tools/write_android_release_metadata.py mobile-android/app/build.gradle mobile-apk/ANDROID_RELEASE_META.txt "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/fix/kit-control-20261017' || github.ref == 'refs/heads/fix/android-178-acceptance-release-20261016' || github.ref == 'refs/heads/fix/android-full-height-menu-panel-20261016' || github.ref == 'refs/heads/feature/android-adaptive-control-center-20261016' || github.ref == 'refs/heads/feature/unified-connection-admin-v2' || github.ref == 'refs/heads/work/sta-ap-diagnostics-20261012' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing/audit-compact-pairing-v1.4.5' || github.ref == 'refs/heads/feature/unified-flight-training-v1.6.1' || github.ref == 'refs/heads/feature/android-reference-cockpit-v1.6.2'
        with:
          name: ZEBJUS_PERMANENTLY_SIGNED_RELEASE_APK_${{ github.ref_name == 'main' && 'release' || 'review' }}
          path: |
            mobile-apk/ZEBJUS_DroneLab_ANDROID_RELEASE.apk
            mobile-apk/SHA256SUMS.txt
            mobile-apk/ANDROID_RELEASE_META.txt
          retention-days: 30
          if-no-files-found: error

      - name: Build production-signed native touchscreen instrumentation
        if: github.ref == 'refs/heads/fix/kit-control-20261017' || github.ref == 'refs/heads/fix/android-178-acceptance-release-20261016' || github.ref == 'refs/heads/fix/android-full-height-menu-panel-20261016' || github.ref == 'refs/heads/feature/android-adaptive-control-center-20261016' || github.ref == 'refs/heads/feature/unified-connection-admin-v2' || github.ref == 'refs/heads/work/sta-ap-diagnostics-20261012' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/unified-flight-training-v1.6.1' || github.ref == 'refs/heads/feature/android-reference-cockpit-v1.6.2'
        env:
          ZEBJUS_ANDROID_SIGNING_PASSWORD: ${{ secrets.ZEBJUS_ANDROID_SIGNING_PASSWORD }}
          ZEBJUS_TEST_RELEASE: '1'
        run: gradle -p mobile-android :app:assembleReleaseAndroidTest --no-daemon

      - name: Package exact-source signed native test bundle
        if: github.ref == 'refs/heads/fix/kit-control-20261017' || github.ref == 'refs/heads/fix/android-178-acceptance-release-20261016' || github.ref == 'refs/heads/fix/android-full-height-menu-panel-20261016' || github.ref == 'refs/heads/feature/android-adaptive-control-center-20261016' || github.ref == 'refs/heads/feature/unified-connection-admin-v2' || github.ref == 'refs/heads/work/sta-ap-diagnostics-20261012' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/unified-flight-training-v1.6.1' || github.ref == 'refs/heads/feature/android-reference-cockpit-v1.6.2'
        run: |
          set -euo pipefail
          mkdir -p native-test-bundle
          cp mobile-android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk native-test-bundle/
          cp "$RUNNER_TEMP/zebjus-previous.apk" native-test-bundle/

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/fix/kit-control-20261017' || github.ref == 'refs/heads/fix/android-178-acceptance-release-20261016' || github.ref == 'refs/heads/fix/android-full-height-menu-panel-20261016' || github.ref == 'refs/heads/feature/android-adaptive-control-center-20261016' || github.ref == 'refs/heads/feature/unified-connection-admin-v2' || github.ref == 'refs/heads/work/sta-ap-diagnostics-20261012' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/unified-flight-training-v1.6.1' || github.ref == 'refs/heads/feature/android-reference-cockpit-v1.6.2'
        with:
          name: ZEBJUS_NATIVE_TOUCH_TEST_BUNDLE
          path: native-test-bundle/
          retention-days: 30
          if-no-files-found: error

  # Only the stable physical 16:9 AVD is a native release gate. It runs
  # both landscape directions with the signed APK, real multi-pointer events,
  # STOP, background/resume, and v12->v13 in-place update verification.
  # The 19.5:9 emulator repeatedly loses ADB after successful boot/install;
  # wide-screen (19.5:9/20:9) responsive WebRTC/touch tests remain mandatory
  # in "Android Landscape Flight WebRTC Tests" and on real phones before claim.
  native_touch:
    name: Native Android touch (16x9 REQUIRED)
    needs: android
    if: github.ref == 'refs/heads/fix/kit-control-20261017' || github.ref == 'refs/heads/fix/android-178-acceptance-release-20261016' || github.ref == 'refs/heads/fix/android-full-height-menu-panel-20261016' || github.ref == 'refs/heads/feature/android-adaptive-control-center-20261016' || github.ref == 'refs/heads/feature/unified-connection-admin-v2' || github.ref == 'refs/heads/work/sta-ap-diagnostics-20261012' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/unified-flight-training-v1.6.1' || github.ref == 'refs/heads/feature/android-reference-cockpit-v1.6.2'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - aspect: 16x9
            avd: zebjus-flight-16x9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: actions/download-artifact@v4
        with:
          name: ZEBJUS_PERMANENTLY_SIGNED_RELEASE_APK_${{ github.ref_name == 'main' && 'release' || 'review' }}
          path: mobile-apk/
      - uses: actions/download-artifact@v4
        with:
          name: ZEBJUS_NATIVE_TOUCH_TEST_BUNDLE
          path: native-test-bundle/
      - name: Verify exact APK source and prepare native upgrade fixture
        run: |
          set -euo pipefail
          sha256sum -c mobile-apk/SHA256SUMS.txt
          grep -Fx "Source commit: $GITHUB_SHA" mobile-apk/ANDROID_RELEASE_META.txt
          mkdir -p mobile-android/app/build/outputs/apk/androidTest/release
          cp native-test-bundle/app-release-androidTest.apk mobile-android/app/build/outputs/apk/androidTest/release/
          cp native-test-bundle/zebjus-previous.apk "$RUNNER_TEMP/zebjus-previous.apk"
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Production-signed APK upgrade and native touch acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          avd-name: ${{ matrix.avd }}
          force-avd-creation: true
          pre-emulator-launch-script: python3 tools/configure-native-avd.py ${{ matrix.aspect }}
          disable-animations: true
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/native-flight-acceptance.sh ${{ matrix.aspect }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-flight-upgrade-touch-evidence-${{ matrix.aspect }}
          path: test-output/native/
          if-no-files-found: ignore

  # Runtime compatibility gate for phones still using Android 11/12.
  # Compilation against API 35 alone cannot catch calls to API-33-only
  # java.io.InputStream methods; this test runs on an API 30 system image.
  legacy_api30:
    name: POCO X2 legacy Android API 30 networking
    needs: android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: actions/download-artifact@v4
        with:
          name: ZEBJUS_PERMANENTLY_SIGNED_RELEASE_APK_release
          path: mobile-apk/
      - uses: actions/download-artifact@v4
        with:
          name: ZEBJUS_NATIVE_TOUCH_TEST_BUNDLE
          path: native-test-bundle/
      - name: Verify source and signed bundle for legacy Android test
        run: |
          set -euo pipefail
          sha256sum -c mobile-apk/SHA256SUMS.txt
          grep -Fx "Source commit: $GITHUB_SHA" mobile-apk/ANDROID_RELEASE_META.txt
          test -s native-test-bundle/app-release-androidTest.apk
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise real API30 HTTP response reader and WebView startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            # android-emulator-runner runs inline scripts with /bin/sh.
            # Avoid Bash-only pipefail; the PASS/RESULT greps remain mandatory.
            set -eu
            adb wait-for-device
            adb install -r mobile-apk/ZEBJUS_DroneLab_ANDROID_RELEASE.apk
            adb install -r native-test-bundle/app-release-androidTest.apk
            adb shell am instrument -w -r -e legacyReaderOnly true in.zebjus.dronelab.companion.test/in.zebjus.dronelab.companion.FlightTouchInstrumentation | tee legacy-api30.log
            grep -F 'PASS API30 network response compatibility' legacy-api30.log
            grep -F 'INSTRUMENTATION_CODE: -1' legacy-api30.log
            if grep -E 'INSTRUMENTATION_FAILED|FAIL native flight acceptance' legacy-api30.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poco-x2-api30-compat-evidence
          path: legacy-api30.log
          if-no-files-found: ignore

  publish:
    name: Publish verified main APK
    needs: [android, native_touch, legacy_api30]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ZEBJUS_PERMANENTLY_SIGNED_RELEASE_APK_release
          path: mobile-apk/
      - name: Verify downloaded release source and checksum
        run: |
          set -euo pipefail
          sha256sum -c mobile-apk/SHA256SUMS.txt
          grep -Fx "Source commit: $GITHUB_SHA" mobile-apk/ANDROID_RELEASE_META.txt

      - name: Require all mandatory checks on the exact source before publication
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/wait-release-checks.mjs

      - name: Publish VERIFIED signed APK to main (never publish debug)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p "$RUNNER_TEMP/zebjus-release-output"
          cp mobile-apk/ZEBJUS_DroneLab_ANDROID_RELEASE.apk mobile-apk/SHA256SUMS.txt mobile-apk/ANDROID_RELEASE_META.txt "$RUNNER_TEMP/zebjus-release-output/"
          git fetch origin main
