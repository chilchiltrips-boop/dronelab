name: Build ZEBJUS Stable-Signed Android APK
on:
  push:
    branches: [testing/audit-compact-pairing-v1.4.5, testing/stable-android-signing-v1.4.2, testing/fast-qr-step2-signed-v1.4.3, feature/android-landscape-flight-controller-v1.6.0, feature/unified-flight-training-v1.6.1, feature/android-reference-cockpit-v1.6.2, main]
    paths:
      - 'docs/flight-training/**'
      - 'mobile-android/**'
      - 'tools/android-camera-permission.test.mjs'
      - 'tools/release-signing.test.mjs'
      - 'tools/verify_signed_android_release.py'
      - 'companion.html'
      - 'companion.css'
      - 'companion.js'
      - 'companion-flight.js'
      - 'flight-input.js'
      - 'js/tripod-page.js'
      - 'pairing-core.js'
      - 'pairing-code.js'
      - 'pairing-qr-ui.js'
      - 'vendor/qrgen.js'
      - 'vendor/jsqr.js'
      - '.github/workflows/build-qr-android.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: zebjus-android-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Package Flight Training, WebRTC and camera assets
        run: |
          set -euo pipefail
          mkdir -p mobile-android/app/src/main/assets/vendor
          cp companion.html companion.css companion.js companion-flight.js flight-input.js pairing-core.js pairing-code.js pairing-qr-ui.js mobile-android/app/src/main/assets/
          cp vendor/qrgen.js vendor/jsqr.js mobile-android/app/src/main/assets/vendor/
          test -s mobile-android/app/src/main/assets/companion.html
          test -s mobile-android/app/src/main/assets/pairing-code.js
          test -s mobile-android/app/src/main/assets/companion-flight.js
          test -s mobile-android/app/src/main/assets/flight-input.js
          test -s mobile-android/app/src/main/assets/vendor/jsqr.js

      - name: Check Android camera, code pairing and permanent release-signing rules
        run: node --test tools/android-camera-permission.test.mjs tools/code-pairing.test.mjs tools/release-signing.test.mjs

      - name: Validate debug compilation (never publish a debug APK)
        run: gradle -p mobile-android :app:assembleDebug --no-daemon

      - name: Load PRIVATE signing key from encrypted GitHub secrets
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing/audit-compact-pairing-v1.4.5' || github.ref == 'refs/heads/feature/unified-flight-training-v1.6.1' || github.ref == 'refs/heads/feature/android-reference-cockpit-v1.6.2'
        env:
          ZEBJUS_ANDROID_KEYSTORE_B64: ${{ secrets.ZEBJUS_ANDROID_KEYSTORE_B64 }}
          ZEBJUS_ANDROID_SIGNING_PASSWORD: ${{ secrets.ZEBJUS_ANDROID_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ZEBJUS_ANDROID_KEYSTORE_B64}" || -z "${ZEBJUS_ANDROID_SIGNING_PASSWORD}" ]]; then
            echo "::error::Missing release signing secrets. Set ZEBJUS_ANDROID_KEYSTORE_B64 and ZEBJUS_ANDROID_SIGNING_PASSWORD in GitHub Settings > Secrets and variables > Actions. See ANDROID_SIGNING_SETUP.md."
            exit 1
          fi
          umask 077
          KEYFILE="$RUNNER_TEMP/zebjus-release.p12"
          printf '%s' "$ZEBJUS_ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYFILE"
          test -s "$KEYFILE"
          echo "ZEBJUS_ANDROID_RELEASE_KEYSTORE_FILE=$KEYFILE" >> "$GITHUB_ENV"

      - name: Assemble permanently signed non-debug release APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing/audit-compact-pairing-v1.4.5' || github.ref == 'refs/heads/feature/unified-flight-training-v1.6.1' || github.ref == 'refs/heads/feature/android-reference-cockpit-v1.6.2'
        env:
          ZEBJUS_ANDROID_SIGNING_PASSWORD: ${{ secrets.ZEBJUS_ANDROID_SIGNING_PASSWORD }}
        run: gradle -p mobile-android :app:assembleRelease --stacktrace --no-daemon

      - name: Refuse wrong APK certificate or app identity
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing/audit-compact-pairing-v1.4.5' || github.ref == 'refs/heads/feature/unified-flight-training-v1.6.1' || github.ref == 'refs/heads/feature/android-reference-cockpit-v1.6.2'
        run: |
          set -euo pipefail
          RELEASE_APK="mobile-android/app/build/outputs/apk/release/app-release.apk"
          test -s "$RELEASE_APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"
          python3 tools/verify_signed_android_release.py "$RELEASE_APK" "$BUILD_TOOLS/apksigner" "$BUILD_TOOLS/aapt" mobile-apk/ZEBJUS_DroneLab_ANDROID_RELEASE.apk
          unzip -l "$RELEASE_APK" | grep -E 'assets/(companion.html|pairing-core.js|pairing-code.js|vendor/jsqr.js)'
          unzip -t "$RELEASE_APK" >/dev/null
          echo "Verified release APK size: $(stat -c %s "$RELEASE_APK") bytes"

      - name: Package one stable Android APK update URL
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing/audit-compact-pairing-v1.4.5' || github.ref == 'refs/heads/feature/unified-flight-training-v1.6.1' || github.ref == 'refs/heads/feature/android-reference-cockpit-v1.6.2'
        run: |
          set -euo pipefail
          cp mobile-apk/ZEBJUS_DroneLab_ANDROID_RELEASE.apk "$RUNNER_TEMP/zebjus-previous.apk"
          mkdir -p mobile-apk
          cp mobile-android/app/build/outputs/apk/release/app-release.apk mobile-apk/ZEBJUS_DroneLab_ANDROID_RELEASE.apk
          sha256sum mobile-apk/ZEBJUS_DroneLab_ANDROID_RELEASE.apk | tee mobile-apk/SHA256SUMS.txt
          sha256sum -c mobile-apk/SHA256SUMS.txt
          printf 'App: in.zebjus.dronelab.companion\nVersion: 1.6.2\nVersionCode: 13\nRelease certificate SHA256: F1:B8:65:75:B3:59:07:34:65:4F:63:8E:4E:0D:68:05:6D:37:B2:E8:88:4A:C7:D6:C2:46:36:FE:9B:51:68:94\n' > mobile-apk/ANDROID_RELEASE_META.txt
          printf 'Source commit: %s\n' "$GITHUB_SHA" >> mobile-apk/ANDROID_RELEASE_META.txt

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing/audit-compact-pairing-v1.4.5' || github.ref == 'refs/heads/feature/unified-flight-training-v1.6.1' || github.ref == 'refs/heads/feature/android-reference-cockpit-v1.6.2'
        with:
          name: ZEBJUS_PERMANENTLY_SIGNED_RELEASE_APK_${{ github.ref_name == 'main' && 'release' || 'review' }}
          path: |
            mobile-apk/ZEBJUS_DroneLab_ANDROID_RELEASE.apk
            mobile-apk/SHA256SUMS.txt
            mobile-apk/ANDROID_RELEASE_META.txt
          retention-days: 30
          if-no-files-found: error

      - name: Build production-signed native touchscreen instrumentation
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/unified-flight-training-v1.6.1' || github.ref == 'refs/heads/feature/android-reference-cockpit-v1.6.2'
        env:
          ZEBJUS_ANDROID_SIGNING_PASSWORD: ${{ secrets.ZEBJUS_ANDROID_SIGNING_PASSWORD }}
          ZEBJUS_TEST_RELEASE: '1'
        run: gradle -p mobile-android :app:assembleReleaseAndroidTest --no-daemon

      - name: Enable emulator hardware acceleration
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/unified-flight-training-v1.6.1' || github.ref == 'refs/heads/feature/android-reference-cockpit-v1.6.2'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Production-signed APK upgrade and Android WebView multitouch acceptance
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/unified-flight-training-v1.6.1' || github.ref == 'refs/heads/feature/android-reference-cockpit-v1.6.2'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/native-flight-acceptance.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-flight-upgrade-touch-evidence
          path: test-output/native/
          if-no-files-found: ignore

      - name: Require all mandatory checks on the exact source before publication
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/wait-release-checks.mjs

      - name: Publish VERIFIED signed APK to main (never publish debug)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p "$RUNNER_TEMP/zebjus-release-output"
          cp mobile-apk/ZEBJUS_DroneLab_ANDROID_RELEASE.apk mobile-apk/SHA256SUMS.txt mobile-apk/ANDROID_RELEASE_META.txt "$RUNNER_TEMP/zebjus-release-output/"
          git fetch origin main
          git diff --exit-code "${{ github.sha }}" origin/main -- mobile-android companion.html companion.css companion.js companion-flight.js flight-input.js pairing-core.js pairing-code.js pairing-qr-ui.js tools/verify_signed_android_release.py
          git checkout -B ci-signed-apk-release origin/main
          mkdir -p mobile-apk
          cp "$RUNNER_TEMP"/zebjus-release-output/* mobile-apk/
          git add mobile-apk/ZEBJUS_DroneLab_ANDROID_RELEASE.apk mobile-apk/SHA256SUMS.txt mobile-apk/ANDROID_RELEASE_META.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Publish permanent-signed ZEBJUS Android release APK [skip ci]'
            git push origin HEAD:main
          fi
