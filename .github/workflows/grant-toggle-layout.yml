name: Verify Grant Mobile Toggle Layout
on:
  push:
    branches: [main]
    paths:
      - 'v2-header.css'
      - 'control-path.css'
      - 'lab.html'
      - 'styles.css'
      - 'index.html'
      - 'tools/grant-toggle-layout-browser.mjs'
      - '.github/workflows/grant-toggle-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    # Playwright 1.56.1 supports this OS; ubuntu-latest moved to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify project and switch markup
        run: |
          node tools/run-domain-tests.mjs ui
          npm run check
          node --check tools/grant-toggle-layout-browser.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser layout checks at 320–1920px in all switch states
        run: |
          mkdir -p test-output
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/toggle-http.log 2>&1 &
          sleep 3
          node tools/grant-toggle-layout-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grant-mobile-layout-screenshots
          path: test-output/
          retention-days: 7
          if-no-files-found: ignore
