name: A2 Motor Setup Browser
on:
  pull_request:
    branches: [main]
    paths:
      - 'js/a2-setup-wizard.js'
      - 'js/flightcore-pid-client.js'
      - 'js/pid-profiles.js'
      - 'js/tripod-page.js'
      - 'tripod.html'
      - 'tripod.css'
      - 'tools/a2-rate-pid-browser.mjs'
      - '.github/workflows/a2-motor-setup.yml'
      - 'js/input-monitor.js'
      - 'js/motor-setup.js'
      - 'js/setup-cues.js'
      - 'sw.js'
      - 'js/a2-setup-visuals.js'
      - 'js/classroom-kits.js'
      - 'js/kit-data-interface.js'
      - 'a2-setup-wizard.css'
      - 'index.html'
      - 'lab.html'
      - 'python-lab-worker.js'
      - 'js/python-lab.js'
      - 'tools/a2-motor-setup-browser.mjs'
      - 'tools/a2-auto-esc.test.mjs'
      - 'tools/a2-output-calibration-stability.test.mjs'
      - 'tools/motor-link-stability.test.mjs'
      - 'tools/ack-diagnostics.test.mjs'
      - 'js/kit-ack-diagnostics.js'
      - 'js/inline-dialogs.js'
      - 'FlightCore_Firmware/build-report.json'
      - 'app-version.json'
      - 'FlightCore_Firmware/FlightCoreAutoEsc.h'
      - 'FlightCore_Firmware/FlightCoreMotor.h'
  push:
    branches: [main]
    paths:
      - 'js/input-monitor.js'
      - 'js/motor-setup.js'
      - 'js/a2-setup-wizard.js'
      - 'js/flightcore-pid-client.js'
      - 'js/pid-profiles.js'
      - 'tools/a2-rate-pid-browser.mjs'
      - 'js/setup-cues.js'
      - 'sw.js'
      - 'js/a2-setup-visuals.js'
      - 'js/classroom-kits.js'
      - 'js/kit-data-interface.js'
      - 'a2-setup-wizard.css'
      - 'index.html'
      - 'lab.html'
      - 'python-lab-worker.js'
      - 'js/python-lab.js'
      - 'tools/a2-motor-setup-browser.mjs'
      - 'tools/a2-auto-esc.test.mjs'
      - 'tools/a2-output-calibration-stability.test.mjs'
      - 'tools/motor-link-stability.test.mjs'
      - 'tools/ack-diagnostics.test.mjs'
      - 'js/kit-ack-diagnostics.js'
      - 'js/inline-dialogs.js'
      - 'FlightCore_Firmware/build-report.json'
      - 'app-version.json'
      - 'FlightCore_Firmware/FlightCoreAutoEsc.h'
      - 'FlightCore_Firmware/FlightCoreMotor.h'
      - '.github/workflows/a2-motor-setup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    # Playwright 1.56.1 supports this OS; ubuntu-latest moved to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Test wizard with a simulated A2 transport
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/a2-http.log 2>&1 &
          for attempt in $(seq 1 20); do curl --silent --fail http://127.0.0.1:8765/ > /dev/null && break; sleep 0.5; done
          node tools/a2-motor-setup-browser.mjs
          node tools/a2-rate-pid-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a2-setup-browser
          path: test-output/
          retention-days: 7
