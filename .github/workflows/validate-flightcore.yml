name: Verify DroneLab FlightCore Firmware Center
on:
  push:
    branches: [fix/kit-control-20261017, fix/android-178-acceptance-release-20261016, feature/legacy-connectivity-port-20261013,work/sta-ap-diagnostics-20261012, fix/usb-rom-runtime-identity-single-line-telemetry, fix/python-editor-two-axis-scroll-sticky-run-controls, feature/python-a1-a2-gyro-read, testing/audit-compact-pairing-v1.4.5, feature/unified-flight-training-v1.6.1, feature/android-reference-cockpit-v1.6.2, release/flightcore-v1-3-unified-telemetry-python-guard, feature/single-row-header-wifi-ota-v1-3-6, main]
    paths:
      - 'vendor/peerjs*'
      - 'tools/android-menu-browser.mjs'
      - 'tools/pid-shell-browser.mjs'
      - 'mobile-android/**'
      - 'companion.html'
      - 'companion.css'
      - 'companion.js'
      - 'companion-flight.js'
      - 'flight-input.js'
      - 'pairing-core.js'
      - 'pairing-code.js'
      - 'remote-rtc.js'
      - 'remote-rtc-config.json'
      - 'remote-telemetry.js'
      - 'pairing.css'
      - 'tripod.html'
      - 'tools/remote-phase1.test.mjs'
      - 'pairing-qr-ui.js'
      - 'vendor/qrgen.js'
      - 'vendor/jsqr.js'
      - 'tools/verify_signed_android_release.py'
      - '.github/workflows/build-qr-android.yml'
      - 'app-version.json'
      - 'docs/flight-training/**'
      - index.html
      - lab.html
      - firmware.css
      - firmware-updater.js
      - js/firmware-image.js
      - tools/firmware_compile_time.py
      - tools/build_scanner.py
      - tools/verify_release.py
      - tools/firmware-build-time.test.mjs
      - tools/firmware-compile-time.test.mjs
      - firmware-catalog.json
      - firmware-latest.json
      - FlightCore_Firmware/**
      - vendor/esptool/bundle.mjs
      - sw.js
      - package.json
      - tools/flightcore.test.mjs
      - 'tools/firmware-guards.test.mjs'
      - 'tools/fast-ota-chunks.test.mjs'
      - 'tools/firmware-host.cpp'
      - 'tools/firmware-host.test.mjs'
      - 'tools/classroom-kits.test.mjs'
      - 'tools/header-ota-regression.test.mjs'
      - 'tools/discovery-pairing.test.mjs'
      - 'tools/wifi-onboarding-recovery.test.mjs'
      - 'tools/python-wifi-ownership.test.mjs'
      - 'js/kit-pairing-store.js'
      - 'tools/browser-pairing-vault.test.mjs'
      - 'js/classroom-kits.js'
      - 'js/network-lab.js'
      - 'classroom-kits.css'
      - tools/serial-tools.test.mjs
      - js/live-inputs.js
      - live-inputs.css
      - tools/live-inputs.test.mjs
      - tools/ppm-inputs.test.mjs
      - tools/connection-freshness-recovery.test.mjs
      - tools/release-metadata.test.mjs
      - js/kit-data-interface.js
      - tools/kit-data-unified.test.mjs
      - js/serial-plotter.js
      - js/usb-live-diagnostic.js
      - js/python-lab.js
      - python-lab-worker.js
      - tools/python-lab.test.mjs
      - 'tools/wifi-onboarding-recovery.test.mjs'
      - 'tools/python-wifi-ownership.test.mjs'
      - 'tools/discovery-pairing.test.mjs'
      - 'js/classroom-kits.js'
      - 'js/network-lab.js'
      - 'classroom-kits.css'
      - js/usb-i2c-bridge.js
      - tools/python-browser-smoke.mjs
      - tools/verify_release.py
      - tools/check.mjs
      - .github/workflows/validate-flightcore.yml
      # Any source edit triggering the signed APK must trigger EVERY exact-SHA
      # publication gate. No check is skipped merely by a path filter.
      - 'tools/android-direct-kit*'
      - 'tools/flight-controller-browser.mjs'
      - 'tools/flight-preview-browser.mjs'
      - 'tools/android-peerjs-menu-regression.test.mjs'
      - 'tools/flight-ack-priority.test.mjs'
      - 'tools/apk-verifier.test.mjs'
      - 'tools/android-camera-permission.test.mjs'
      - 'tools/native-flight-acceptance.sh'
      - 'tools/configure-native-avd.py'
      - 'tools/release-signing.test.mjs'
      - 'tools/network-transport.test.mjs'
      - 'tools/controls-browser.mjs'
      - 'tools/android-origin-wifi-nsd.test.mjs'
      - 'tools/android-grants-vault-ota.test.mjs'
      - 'tools/android-connection-reliability.test.mjs'
      - 'tools/android-simple-ap-connect.test.mjs'
      - 'tools/write_android_release_metadata.py'
      - 'tools/verify_android_assets.py'
      - 'tools/wait-release-checks.mjs'
      - 'companion-network.js'
      - 'android-native-bridge.js'
      - 'companion-menu.js'
      - 'js/kit-auth.js'
      - 'js/kit-network-policy.js'
      - 'js/kit-ack-diagnostics.js'
      - 'vendor/crypto/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: python3 tools/verify_release.py
      - run: npm run check
      - run: node --check firmware-updater.js
