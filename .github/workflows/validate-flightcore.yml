name: Verify DroneLab FlightCore Firmware Center
on:
  push:
    branches: [testing/audit-compact-pairing-v1.4.5, feature/unified-flight-training-v1.6.1, feature/android-reference-cockpit-v1.6.2, safety/usb-board-image-identity-preflash, main]
    paths:
      - 'mobile-android/**'
      - 'companion.html'
      - 'companion.css'
      - 'companion.js'
      - 'companion-flight.js'
      - 'flight-input.js'
      - 'pairing-core.js'
      - 'pairing-code.js'
      - 'pairing-qr-ui.js'
      - 'vendor/qrgen.js'
      - 'vendor/jsqr.js'
      - 'tools/verify_signed_android_release.py'
      - '.github/workflows/build-qr-android.yml'
      - 'app-version.json'
      - 'docs/flight-training/**'
      - index.html
      - lab.html
      - firmware.css
      - firmware-updater.js
      - firmware-catalog.json
      - firmware-latest.json
      - FlightCore_Firmware/**
      - vendor/esptool/bundle.mjs
      - sw.js
      - package.json
      - tools/flightcore.test.mjs
      - 'tools/firmware-guards.test.mjs'
      - tools/serial-tools.test.mjs
      - tools/verify_release.py
      - tools/check.mjs
      - .github/workflows/validate-flightcore.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: python3 tools/verify_release.py
      - run: npm run check
      - run: node --check firmware-updater.js
