name: Build and verify FlightCore A1/A2 AP/STA Firmware
on:
  push:
    branches: [fix/udp-management-20261018, fix/firmware-one-line-rc-imu-20261017, fix/kit-control-20261017, feature/legacy-connectivity-port-20261013,feature/simple-kit-connection-v1-4-1, work/sta-ap-diagnostics-20261012, main, fix/usb-rom-runtime-identity-single-line-telemetry, feature/ap-sta-transport-v1, feature/classroom-my-kits-webapp-v1-4-1, feature/authoritative-status-integration-20261021]
    paths:
      - 'FlightCore_Firmware/I2C_ADDRESS_SCANNER.ino'
      - 'FlightCore_Firmware/*.h'
      - 'tools/embed_setup_portal.py'
      - 'tools/setup-portal.html'
      - 'js/kit-auth.js'
      - 'FlightCore_Firmware/FlightCoreClassroom.h'
      # Catalog is generated by this job; excluding it prevents release loops.
      - 'VERSION.txt'
      - 'FlightCore_Firmware/partitions.csv'
      - 'tools/build_scanner.py'
      - 'tools/flightcore.test.mjs'
      - 'tools/apk-verifier.test.mjs'
      - 'tools/serial-tools.test.mjs'
      - 'js/serial-plotter.js'
      - 'js/python-lab.js'
      - 'python-lab-worker.js'
      - 'tools/python-lab.test.mjs'
      - 'tools/python-browser-smoke.mjs'
      - 'tools/verify_release.py'
      - 'tools/firmware-guards.test.mjs'
      - 'tools/fast-ota-chunks.test.mjs'
      - 'tools/firmware-host.cpp'
      - 'tools/firmware-host.test.mjs'
      - 'tools/ppm-host.cpp'
      - 'tools/ppm-host.test.mjs'
      - 'tools/led-failsafe.test.mjs'
      - 'tools/UdpStreamInterop.java'
      - 'tools/UdpFeedbackInterop.java'
      - 'tools/network-transport.test.mjs'
      - 'tools/classroom-kits.test.mjs'
      - 'tools/wifi-onboarding-recovery.test.mjs'
      - 'tools/python-wifi-ownership.test.mjs'
      - 'tools/discovery-pairing.test.mjs'
      - 'js/classroom-kits.js'
      - 'js/network-lab.js'
      - 'index.html'
      - 'classroom-kits.css'
      - 'tools/offline-cache.test.mjs'
      - 'sw.js'
      - '.github/workflows/build-i2c-scanner.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scanner-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Detect already verified exact-source A1/A2 images
        id: firmware_integrity
        run: |
          if python3 tools/verify_release.py; then
            echo 'rebuild=false' >> "$GITHUB_OUTPUT"
            echo 'Verified APP/FACTORY SHA-256 and source manifest: no firmware rebuild needed'
          else
            echo 'rebuild=true' >> "$GITHUB_OUTPUT"
            echo 'Source or firmware changed; compile both boards and refresh manifest'
          fi
      # Prevent wasting A1/A2 compile resources on stale Android release test
      # expectations. This also keeps the versioned firmware publication gated.
      - name: Preflight source and release regression contracts
        if: steps.firmware_integrity.outputs.rebuild == 'true'
        run: |
          node --test tools/ack-diagnostics.test.mjs tools/android-camera-permission.test.mjs tools/connection-freshness-recovery.test.mjs tools/poco-x2-network-compat.test.mjs
      - uses: arduino/setup-arduino-cli@v2
        if: steps.firmware_integrity.outputs.rebuild == 'true'
      - name: Compile board-specific FlightCore A1/A2 (Scanner, LED, Gyro, USB CDC)
        if: steps.firmware_integrity.outputs.rebuild == 'true'
        run: |
          python3 tools/embed_setup_portal.py
          python3 tools/build_scanner.py
      - name: Validate both APP and Factory binaries
        run: |
          python3 tools/verify_release.py
          npm test
          npm run check
          node --check firmware-updater.js
      - name: Upload A1/A2 APP and Factory firmware artifacts
        if: steps.firmware_integrity.outputs.rebuild == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zebjus-flightcore-a1-a2-ap-sta-${{ github.run_id }}
          path: |
            FlightCore_Firmware/*_APP.bin
            FlightCore_Firmware/*_FACTORY.bin
            FlightCore_Firmware/build-report.json
          if-no-files-found: error
      - name: Commit verified firmware images and SHA-256 metadata
        if: steps.firmware_integrity.outputs.rebuild == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add FlightCore_Firmware firmware-catalog.json firmware-latest.json app-version.json
          git diff --cached --quiet || git commit -m "build: verified FlightCore $(cat VERSION.txt) APP and FACTORY images"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
