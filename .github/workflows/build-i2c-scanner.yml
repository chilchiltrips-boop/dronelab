name: Build FlightCore A1/A2 USB Firmware 1.2.x
on:
  push:
    branches: [main, fix/flightcore-v1-2-1-serial-hardware]
    paths:
      - 'FlightCore_Firmware/I2C_ADDRESS_SCANNER.ino'
      - 'FlightCore_Firmware/catalog.json'
      - 'VERSION.txt'
      - 'FlightCore_Firmware/partitions.csv'
      - 'tools/build_scanner.py'
      - 'tools/flightcore.test.mjs'
      - 'tools/firmware-guards.test.mjs'
      - 'tools/offline-cache.test.mjs'
      - 'sw.js'
      - '.github/workflows/build-i2c-scanner.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scanner-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: arduino/setup-arduino-cli@v2
      - name: Compile board-specific FlightCore A1/A2 (Scanner, LED, Gyro, USB CDC)
        run: python3 tools/build_scanner.py
      - name: Validate both APP and Factory binaries
        run: |
          python3 tools/verify_release.py
          npm test
          npm run check
          node --check firmware-updater.js
      - name: Upload A1/A2 APP and Factory firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zebjus-flightcore-a1-a2-usb-v1-2-1
          path: |
            FlightCore_Firmware/*_APP.bin
            FlightCore_Firmware/*_FACTORY.bin
            FlightCore_Firmware/build-report.json
          if-no-files-found: error
      - name: Commit verified firmware images and SHA-256 metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add FlightCore_Firmware firmware-catalog.json firmware-latest.json
          git diff --cached --quiet || git commit -m 'Release FlightCore A1/A2 USB firmware 1.2.1'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
