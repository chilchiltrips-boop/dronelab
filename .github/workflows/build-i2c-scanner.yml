name: Build I2C Scanner + LED A1 and A2
on:
  push:
    branches: [main, feature/python-led-i2c-tripod-front-v1]
    paths:
      - 'FlightCore_Firmware/I2C_ADDRESS_SCANNER.ino'
      - 'VERSION.txt'
      - 'FlightCore_Firmware/partitions.csv'
      - 'tools/build_scanner.py'
      - 'tools/flightcore.test.mjs'
      - '.github/workflows/build-i2c-scanner.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scanner-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: arduino/setup-arduino-cli@v2
      - name: Compile I2C Scanner + programmable LED for ESP32-C3 and XIAO ESP32-C6
        run: python3 tools/build_scanner.py
      - name: Validate both APP and Factory binaries
        run: |
          python3 tools/verify_release.py
          npm test
          npm run check
          node --check firmware-updater.js
      - name: Upload A1/A2 APP and Factory firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zebjus-a1-a2-i2c-led-firmware
          path: |
            FlightCore_Firmware/*_APP.bin
            FlightCore_Firmware/*_FACTORY.bin
            FlightCore_Firmware/build-report.json
          if-no-files-found: error
      - name: Commit verified firmware images and SHA-256 metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add FlightCore_Firmware firmware-catalog.json firmware-latest.json
          git diff --cached --quiet || git commit -m 'Release I2C scanner + LED A1/A2 USB firmware 1.1.0'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
