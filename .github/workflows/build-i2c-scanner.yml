name: Build and verify FlightCore A2 AP/STA Firmware
on:
  push:
    branches: [main]
    # Compile only when compiled C++/Arduino inputs or build provenance change.
    # UI/JS/HTML/README edits have independent WebApp regression workflows.
    paths:
      - 'FlightCore_Firmware/I2C_ADDRESS_SCANNER.ino'
      - 'FlightCore_Firmware/*.h'
      - 'FlightCore_Firmware/partitions.csv'
      - 'FlightCore_Firmware/bench-release-policy.json'
      - 'FlightCore_Firmware/publication-hold.json'
      - 'VERSION.txt'
      - 'js/pid-profiles.js'
      - 'tools/sync-pid-profiles.mjs'
      - 'tools/build_scanner.py'
      - 'tools/embed_setup_portal.py'
      - 'tools/setup-portal.html'
      - 'tools/bench_release_gate.py'
      - 'tools/verify_release.py'
      - 'tools/firmware_compile_time.py'
      - '.github/workflows/build-i2c-scanner.yml'
      - '.github/actions/setup-flightcore/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scanner-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Detect already verified exact-source A2 images
        id: firmware_integrity
        run: |
          if test -f FlightCore_Firmware/publication-hold.json; then
            python3 tools/verify_release.py
            echo 'rebuild=true' >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_REF_NAME" = "main" ] && python3 tools/bench_release_gate.py --publish-source; then
              echo 'publish=true' >> "$GITHUB_OUTPUT"
              echo 'Bench-only candidate approved for software publication; flight output remains disabled'
            else
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              echo 'Keep candidate as build artifact; stable release remains held'
            fi
          elif python3 tools/verify_release.py; then
            echo 'rebuild=false' >> "$GITHUB_OUTPUT"
            echo 'Verified APP/FACTORY SHA-256 and source manifest: no firmware rebuild needed'
          else
            echo 'rebuild=true' >> "$GITHUB_OUTPUT"
            echo 'Source or firmware changed; compile A2 and refresh manifest'
          fi
      # Prevent wasting A2 compile resources on stale Android release test
      # expectations. This also keeps the versioned firmware publication gated.
      - name: Preflight source and release regression contracts
        if: steps.firmware_integrity.outputs.rebuild == 'true'
        run: |
          node --test tools/ack-diagnostics.test.mjs tools/android-camera-permission.test.mjs tools/connection-freshness-recovery.test.mjs tools/poco-x2-network-compat.test.mjs
      - uses: ./.github/actions/setup-flightcore
        if: steps.firmware_integrity.outputs.rebuild == 'true'
      - name: Compile board-specific FlightCore A2 (Scanner, LED, Gyro, USB CDC)
        if: steps.firmware_integrity.outputs.rebuild == 'true'
        run: |
          python3 tools/embed_setup_portal.py
          git diff --exit-code -- FlightCore_Firmware/FlightCoreSetupPortal.h
          python3 tools/build_scanner.py --skip-core-install
      - name: Validate both APP and Factory binaries
        run: |
          python3 tools/verify_release.py
          if [ -f FlightCore_Firmware/bench-release-policy.json ]; then python3 tools/bench_release_gate.py --compiled; fi
          sha256sum FlightCore_Firmware/catalog.json FlightCore_Firmware/build-report.json # exact-image provenance for approval
          npm test
          npm run check
          node --check firmware-updater.js
      - name: Upload A2 APP and Factory firmware artifacts
        if: steps.firmware_integrity.outputs.rebuild == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zebjus-flightcore-a2-ap-sta-${{ github.run_id }}
          path: |
            FlightCore_Firmware/ZEBJUS_FLIGHTCORE_A2_APP.bin
            FlightCore_Firmware/ZEBJUS_FLIGHTCORE_A2_FACTORY.bin
            FlightCore_Firmware/build-report.json
            FlightCore_Firmware/catalog.json
            FlightCore_Firmware/latest.json
          if-no-files-found: error
      - name: Commit verified firmware images and SHA-256 metadata
        if: github.ref == 'refs/heads/main' && steps.firmware_integrity.outputs.rebuild == 'true' && steps.firmware_integrity.outputs.publish == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          outputs=(FlightCore_Firmware/ZEBJUS_FLIGHTCORE_A2_APP.bin FlightCore_Firmware/ZEBJUS_FLIGHTCORE_A2_FACTORY.bin
            FlightCore_Firmware/build-report.json FlightCore_Firmware/catalog.json
            FlightCore_Firmware/latest.json firmware-catalog.json firmware-latest.json)
          git add -- "${outputs[@]}" app-version.json
          if [ -f FlightCore_Firmware/publication-hold.json ]; then git rm FlightCore_Firmware/publication-hold.json; fi
          generated="$(git write-tree)"
          git fetch origin "${GITHUB_REF_NAME}"
          git worktree add --detach "$RUNNER_TEMP/flightcore-publish" FETCH_HEAD
          cd "$RUNNER_TEMP/flightcore-publish"
          git restore --source="$generated" --staged --worktree -- "${outputs[@]}"
          if [ -f FlightCore_Firmware/publication-hold.json ]; then git rm FlightCore_Firmware/publication-hold.json; fi
          if git diff --quiet "$GITHUB_SHA" HEAD -- app-version.json; then
            git restore --source="$generated" --staged --worktree -- app-version.json
          fi
          # Verify against the branch tip, including any source pushed during compilation.
          python3 tools/verify_release.py
          git diff --cached --quiet || git commit -m "build: verified FlightCore $(cat VERSION.txt) APP and FACTORY images"
          git push origin "HEAD:${GITHUB_REF_NAME}"
