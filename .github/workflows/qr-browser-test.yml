name: QR WebRTC Browser Pairing Test
on:
  push:
    branches: [testing/audit-compact-pairing-v1.4.5, testing/two-way-qr-pairing, fix/android-camera-permission-v1.1.1, testing/one-scan-qr-v1.2.0, testing/smart-two-way-qr-v1.3.0, testing/qr-and-6digit-code-v1.4.0, testing/fix-code-timeout-v1.4.1, testing/stable-android-signing-v1.4.2, testing/fast-qr-step2-signed-v1.4.3, main]
    paths:
      - 'pairing-core.js'
      - 'pairing-code.js'
      - 'pairing-qr-ui.js'
      - 'pairing-web.js'
      - 'companion.js'
      - 'companion.html'
      - 'companion.css'
      - 'pairing.css'
      - 'index.html'
      - 'lab.html'
      - 'vendor/qrgen.js'
      - 'vendor/jsqr.js'
      - 'tools/qr-pairing-browser.mjs'
      - 'tools/audit-browser.mjs'
      - 'tools/controls-browser.mjs'
      - 'tools/*.test.mjs'
      - 'package.json'
      - 'tools/browser-harness.mjs'
      - 'tools/offline-browser.mjs'
      - 'sw.js'
      - 'project.css'
      - 'js/**'
      - 'tools/code-live-smoke.mjs'
      - '.github/workflows/qr-browser-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p2p-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check pairing-core.js
          node --check pairing-code.js
          node --check pairing-qr-ui.js
          node --check pairing-web.js
          node --check companion.js
          node --check tools/qr-pairing-browser.mjs
      - name: Install isolated Chromium test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test two real WebRTC peers and all LED protocol checks
        run: |
          mkdir -p test-output
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/qr-pairing-http.log 2>&1 &
          sleep 3
          npm run check
          npm test
          npm run verify:firmware
          node tools/qr-pairing-browser.mjs
          node tools/audit-browser.mjs
          node tools/controls-browser.mjs
          node tools/offline-browser.mjs
      - name: Optional live PeerJS Cloud code pairing smoke
        continue-on-error: true
        timeout-minutes: 2
        run: node tools/code-live-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qr-webapp-android-ui-browser-screenshots
          path: test-output/
          if-no-files-found: ignore
